{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portalai.secretName" . }}
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DATABASE_URL / REDIS_URL carry credentials, so they live in the Secret, not
  # the ConfigMap. Composed from the data-dep values (external here; bundled
  # service names in slice 4).
  DATABASE_URL: {{ include "portalai.databaseUrl" . | quote }}
  REDIS_URL: {{ include "portalai.redisUrl" . | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
