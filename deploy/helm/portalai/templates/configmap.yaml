apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portalai.fullname" . }}-config
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
data:
  DEPLOY_MODE: {{ .Values.deployMode | quote }}
  # Web config.js selects the auth provider from AUTH_PROVIDER; default it from
  # the deploy mode so residency installs get OIDC without a second knob.
  AUTH_PROVIDER: {{ if eq .Values.deployMode "residency" }}"oidc"{{ else }}"auth0"{{ end }}
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_AUDIENCE: {{ .Values.oidc.audience | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  # S3/MinIO uploads. ENDPOINT + FORCE_PATH_STYLE are consumed once #567 lands;
  # BUCKET/REGION are read today. Composed bundled-vs-external in _helpers.tpl.
  UPLOAD_S3_ENDPOINT: {{ include "portalai.s3Endpoint" . | quote }}
  UPLOAD_S3_BUCKET: {{ include "portalai.s3Bucket" . | quote }}
  UPLOAD_S3_REGION: {{ if .Values.minio.enabled }}"us-east-1"{{ else }}{{ .Values.minio.external.region | quote }}{{ end }}
  UPLOAD_S3_FORCE_PATH_STYLE: {{ if .Values.minio.enabled }}"true"{{ else }}{{ .Values.minio.external.forcePathStyle | quote }}{{ end }}
  # Invite links are built on the web origin, and production refuses invites
  # without a real one (#889). Default it from the ingress host; an explicit
  # config.WEB_APP_URL wins (and renders below, so it isn't written twice).
  {{- if and .Values.ingress.enabled .Values.ingress.host (not (hasKey .Values.config "WEB_APP_URL")) }}
  WEB_APP_URL: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host | quote }}
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
