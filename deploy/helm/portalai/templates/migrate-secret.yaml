{{- /*
#660: the external migration user's inline password, in its own Secret so
only the migrate/upgrade jobs can reference it (the API pods envFrom the main
Secret, not this one). A hook, like the jobs that read it, so it exists
before they run.
*/ -}}
{{- $ext := .Values.postgresql.external }}
{{- if and (not .Values.postgresql.enabled) $ext.migrationUser (not $ext.migrationExistingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portalai.fullname" . }}-migrate
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  password: {{ required "postgresql.external.migrationPassword is required when migrationUser is set without migrationExistingSecret" $ext.migrationPassword | quote }}
{{- end }}
