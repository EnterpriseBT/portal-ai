apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portalai.fullname" . }}-web
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "portalai.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portalai.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        # The web config.js is rendered from env at container start, so roll
        # web pods when the shared config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ required "image.web.repository is required" .Values.image.web.repository }}:{{ required "image.web.tag is required" .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          # config.js (render-config.mjs) reads AUTH_PROVIDER / OIDC_* / DEPLOY_MODE
          # from the shared ConfigMap. No Secret — only non-secret, client-visible
          # values belong in config.js.
          envFrom:
            - configMapRef:
                name: {{ include "portalai.fullname" . }}-config
          {{- with .Values.web.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
