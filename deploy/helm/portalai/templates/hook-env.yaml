{{- /*
#946: the env the migrate/upgrade hook jobs load. A pre-install/pre-upgrade
hook runs before Helm creates or updates the release's ConfigMap and Secret:
on install they don't exist yet, and on upgrade they still hold the previous
release's values, so a value added or changed by this upgrade (SYSTEM_ID, a
new DATABASE_URL) would reach the migrations one upgrade late. These copies
are hooks at a lower weight than the jobs, so they exist with this render's
values first. Kept between runs (replaced on the next), like the jobs.
*/ -}}
{{- if or .Values.migrate.enabled .Values.upgrade.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portalai.fullname" . }}-hook-config
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- include "portalai.configData" . | nindent 2 }}
{{- if not .Values.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portalai.fullname" . }}-hook-secret
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- include "portalai.secretData" . | nindent 2 }}
{{- end }}
{{- end }}
