apiVersion: v1
kind: Service
metadata:
  name: {{ include "portalai.fullname" . }}-web
  labels:
    {{- include "portalai.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "portalai.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
