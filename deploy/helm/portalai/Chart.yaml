apiVersion: v2
name: portalai
description: >-
  Portals AI — full-residency install. Deploys the API and the standalone web
  SPA as one release, with data dependencies either bundled (evaluation) or
  pointed at managed endpoints (production). See README.md.
type: application
# Chart version — bump on chart changes.
version: 0.2.0
# App version — overridden at package time with the release image tag/SHA.
appVersion: "0.0.0"

# No subchart dependencies (#946). The bundled data deps (PostGIS, Redis,
# S3-compatible object storage, Keycloak) are this chart's own templates on
# maintained upstream images: the Bitnami subcharts they replaced pinned images
# that are gone from docker.io/bitnami, and MinIO no longer publishes images.
