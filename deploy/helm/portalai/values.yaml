# Portals AI residency chart — default values. See README.md for the full
# reference. The chart installs the api + web workloads with their config and
# secret env and split liveness/readiness probes; bundled data dependencies
# (PostGIS, Redis and S3-compatible object storage, evaluation-grade); the
# migrate, seed and #581 upgrade hooks; an optional ingress; and an optional
# bundled Keycloak issuer for installs with no customer IdP (#566, #946).

# Container images. repository/tag are required at install (the deploy pipeline
# pushes them to ECR; a customer mirrors them into their own registry).
image:
  api:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

# Pull secrets for a private registry, e.g. [{ name: regcred }].
imagePullSecrets: []

api:
  replicaCount: 1
  port: 3001
  # Extra/override env injected directly on the api container (in addition to
  # the ConfigMap + Secret envFrom).
  env: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Runs as the node image's uid-1000 `node` user. runAsNonRoot is enforced
  # here until the image is hardened to build non-root (#571).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

web:
  replicaCount: 1
  # nginx-unprivileged listens on 8080.
  port: 8080
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # nginx-unprivileged runs as uid 101. Its USER is the name `nginx`, which
  # runAsNonRoot can't verify, so the uid is given numerically.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  # Map basemap (#910), served to browsers through config.js.
  #   none    (default) no basemap: maps draw their data on a plain
  #           background and browsers fetch no map tiles at all.
  #   custom  your own tile server: styleUrl is a MapLibre style JSON URL or a
  #           raster XYZ template (https://…/{z}/{x}/{y}.png). The style and
  #           its tiles must allow CORS from the app's origin.
  #   default CARTO + OpenStreetMap, the SaaS basemap (third-party egress).
  # Every map uses this basemap whatever its own spec names.
  basemap:
    mode: none
    styleUrl: ""
    # Optional dark-theme style; styleUrl is used in both themes when empty.
    styleUrlDark: ""
    # Attribution shown for an XYZ template (a style JSON carries its own).
    attribution: ""

# Per-container hardening applied to both workloads. readOnlyRootFilesystem is
# off because the api writes transient files; tightened with #571.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# saas | residency — sets DEPLOY_MODE (selects the API's auth validator) and
# is echoed into the web config.js. The default stays `saas` so the chart's
# mode always matches an explicit choice; a residency install sets
# `residency`, which also enables the API's boot guard (OIDC required, no
# central Stripe credentials — apps/api/src/config/deploy-mode.ts).
deployMode: saas

# OIDC identity (residency). Non-secret; reaches the API validator and the web
# config.js. Ignored in saas mode (Auth0 via secrets/config). With
# bundledIssuer.enabled, each empty field defaults from the bundled Keycloak;
# a value set here always wins.
oidc:
  issuer: ""
  audience: ""
  clientId: ""

# Non-secret env → ConfigMap. Arbitrary key/value pairs the app reads from env
# (e.g. AUTH0_DOMAIN, PUBLIC_API_BASE_URL, WEB_APP_URL, CORS_ORIGIN, GOOGLE_*
# non-secret). WEB_APP_URL (invite links) and PUBLIC_API_BASE_URL (where
# webhook toolpack runtimes call back) both default from ingress.host (https with
# ingress.tls). Without an ingress, set them here: a missing WEB_APP_URL refuses
# invitations (#889); a missing PUBLIC_API_BASE_URL only stops webhook tools that
# stream data in, or return results too large to send inline (#891). An empty
# value counts as unset. The install notes say which is missing.
config: {}

# Secret env → Secret (e.g. ENCRYPTION_KEY, ANTHROPIC_API_KEY,
# OAUTH_STATE_SECRET). Never STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET on a
# residency install: the API refuses to boot with them, since residency
# entitlement comes from the marketplace, not the Stripe webhook. Rendered into a chart-managed Secret unless
# existingSecret is set, in which case the app reads env from that Secret and
# these are ignored.
secrets: {}
existingSecret: ""

# ── Data dependencies ────────────────────────────────────────────────────
# Each is bundled by default and disable-able to an external managed endpoint.
# Bundled deps are this chart's own single-replica StatefulSets on maintained
# upstream images (#946): evaluation-grade, no HA, no backups. Production
# points at managed services via `enabled: false` and the `external` block.
# DATABASE_URL / REDIS_URL / UPLOAD_S3_* are composed in _helpers.tpl.

postgresql:
  enabled: true
  # PostGIS (migration 0076 runs CREATE EXTENSION postgis). imresamu/postgis is
  # the official postgres image + PostGIS, built for arm64 and amd64 (the
  # postgis/postgis image has no arm64).
  image:
    repository: imresamu/postgis
    tag: "17-3.5"
    pullPolicy: IfNotPresent
  auth:
    # The app's own user, which owns the database. The bundled DB's superuser
    # (`postgres`) is used only by the migrate/upgrade jobs (#660); its
    # password is generated on first install and kept in the
    # <release>-portalai-postgresql Secret unless set here.
    username: portalai
    password: portalai
    database: portalai
    postgresPassword: ""
  persistence:
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  external:
    host: ""
    port: 5432
    database: portalai
    user: portalai
    password: ""
    # #660: optional privileged user (superuser or CREATEROLE) for an
    # external DB whose app user (above) lacks CREATEROLE. The migrate/upgrade
    # jobs use it only to create the restricted SQL reader role and grant it
    # to the app user; schema migrations still run as the app user, and the
    # API pods never get it. Give the password inline or through an existing
    # Secret. Leave the user empty and the app user creates the role itself
    # (it must then hold CREATEROLE, or provision the role by hand: see
    # README). With the bundled DB its postgres superuser is used
    # automatically.
    migrationUser: ""
    migrationPassword: ""
    migrationExistingSecret:
      name: ""
      key: password

redis:
  enabled: true
  # Same 7.4 line as the managed ElastiCache the SaaS runs. Auth off: it is
  # reachable only inside the cluster. A managed Redis (enabled:false) carries
  # its own auth in the URL.
  image:
    repository: redis
    tag: "7.4.12-alpine"
    pullPolicy: IfNotPresent
  # Redis is the durable BullMQ store, so it always keeps an append-only file
  # on a volume: without one, in-flight jobs are lost on a pod restart.
  persistence:
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  external:
    # redis:// or rediss://. With rediss:// the API connects over TLS (the
    # scheme is the switch, #852).
    url: ""
    tls:
      # A Secret holding the PEM of a private CA that signs the managed Redis's
      # certificate. Leave name empty when the cert chains to a public root.
      caSecret:
        name: ""
        key: ca.crt

# S3-compatible object storage for file uploads. Browsers upload straight to
# it through presigned URLs, so its endpoint must be reachable from the
# browser AND from the API pods under the same URL (the host is signed).
objectStorage:
  enabled: true
  # SeaweedFS (Apache-2.0), single server with its S3 gateway (#946).
  image:
    repository: chrislusf/seaweedfs
    tag: "4.48"
    pullPolicy: IfNotPresent
  bucket: portalai-uploads
  # The app's S3 credentials, scoped to the bucket. Generated on first install
  # and kept in the <release>-portalai-s3 Secret unless set here.
  auth:
    accessKey: portalai
    secretKey: ""
  # Public hostname, served by the chart's ingress (ingress.enabled). Without
  # it the endpoint is the in-cluster service, which a browser can't reach, so
  # uploads only work through a host set here.
  publicHost: ""
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  external:
    endpoint: ""
    region: us-east-1
    bucket: portalai-uploads
    forcePathStyle: true

# ── Lifecycle hooks ──────────────────────────────────────────────────────
# Run the API image's existing migrate/seed entrypoints as Jobs.
# migrate: with an external DB, a pre-install hook (schema ready before the
# api pods start). With the bundled DB, which doesn't exist until the release
# does, a plain Job on first install that waits for the DB; the api pods and
# the seed wait for its migrations (#946). seed is post-install (idempotent
# global seeds).
migrate:
  enabled: true
seed:
  enabled: true
# On `helm upgrade`, a single pre-upgrade job runs migrations + the idempotent
# global seed under one advisory lock (`db:upgrade`, #581), before the api pods
# roll. First install still uses migrate + seed.
upgrade:
  enabled: true

# ── Ingress ──────────────────────────────────────────────────────────────
# Off by default (reach the app by port-forward, or bring your own ingress).
# When enabled, /api routes to the API service and / to the web service on
# ingress.host, plus bundledIssuer.host → Keycloak and objectStorage.publicHost
# → object storage when those are set. TLS via a cert-manager-issued secret
# that covers every host — see README.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

# ── Bundled identity issuer (Keycloak) ───────────────────────────────────
# Optional OIDC issuer for residency installs with no customer IdP: the
# official Keycloak image, a realm imported at start with one public SPA
# client, and oidc.* defaulted from it (#946). Needs the chart's ingress:
# ingress.host is the app origin the client allows, and `host` is the issuer's
# public hostname, which browsers and the API pods must both resolve. Users
# are created by an operator in Keycloak's admin console; the realm has no
# self-registration.
bundledIssuer:
  enabled: false
  host: ""
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.8.0"
    pullPolicy: IfNotPresent
  realm: portalai
  clientId: portalai-web
  # The access token's `aud`, which the API validates.
  audience: portalai-api
  # Keycloak's bootstrap admin. The password is generated on first install and
  # kept in the <release>-portalai-keycloak Secret unless set here.
  admin:
    username: admin
    password: ""
  # Keycloak's own data (realm, users) in its file database on this volume.
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
