# Residency web image server config (#566). Serves the built SPA with
# history-API fallback so client-side routes (TanStack Router) resolve on a
# hard refresh. nginx-unprivileged runs as uid 101 and listens on 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is regenerated per container start (#566) — never cache it,
    # or a browser would pin a stale OIDC issuer across a redeploy.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html (never cached, so a new
    # deploy's index — pointing at new hashed assets — is picked up promptly).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
