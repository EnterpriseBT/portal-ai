AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Portals AI — account-global least-privilege IAM (#397). The assume-only
  operator user and the per-env read/write operator roles it may assume.
  This stack is account-global (it holds BOTH envs' operator roles), deployed
  once out-of-band by an admin as "portalai-iam" — NOT per-env, NOT by the
  deploy pipeline (a deploy role cannot grant its own scoped policy).
  The scoped deploy-role policies (Deploy{Dev,Prod}Policy) are added in a
  later change (#397 slice 2) once mined from CloudTrail — deliberately
  absent here so this stack touches nothing on the live deploy roles.

# No Environment parameter: this stack is global and defines both envs'
# operator roles, so each env is a literal per resource.

Resources:
  # ══════════════════════════════════════════════════════════
  #  Operator identity — assume-only user
  # ══════════════════════════════════════════════════════════
  # SSO / IAM Identity Center is not set up in this account, so the operator
  # identity is a low-privilege IAM user whose ONLY permission is to assume
  # the per-env operator roles below. Standing credentials on a laptop are
  # inert without an sts:AssumeRole step. (If Identity Center is enabled
  # later, this user is swapped for a permission set that assumes the same
  # roles — the roles stay.)
  OperatorUser:
    Type: AWS::IAM::User
    Properties:
      UserName: portalai-operator
      Tags:
        - Key: Name
          Value: portalai-operator

  OperatorAssumePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: portalai-operator-assume
      Users:
        - !Ref OperatorUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeOperatorRoles
            Effect: Allow
            Action: sts:AssumeRole
            Resource:
              - !GetAtt DevOperatorReadRole.Arn
              - !GetAtt DevOperatorWriteRole.Arn
              - !GetAtt ProdOperatorReadRole.Arn
              - !GetAtt ProdOperatorWriteRole.Arn

  # ══════════════════════════════════════════════════════════
  #  Read policies — the inspection surface (per env)
  # ══════════════════════════════════════════════════════════
  # Matches docs/AWS_CLI_OPS.md's documented read set, scoped to the env.
  # Read-only account-wide Describe/List (ecs/rds/cfn/elb) are left broad:
  # they are list-only, largely don't support resource scoping, and a
  # too-tight read role is the fail-CLOSED risk (an operator locked out
  # mid-incident). The SENSITIVE reads (secrets, params, the bastion tunnel)
  # are tightly env-scoped.
  DevOperatorReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: portalai-dev-operator-read
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogsRead
            Effect: Allow
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - logs:GetQueryResults
              - logs:StartQuery
              - logs:StopQuery
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/portalai-api-dev"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/portalai-api-dev:*"
          - Sid: ServiceDescribeReadOnly
            Effect: Allow
            Action:
              - ecs:Describe*
              - ecs:List*
              - rds:Describe*
              - cloudformation:Describe*
              - cloudformation:List*
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - elasticloadbalancing:Describe*
            Resource: "*"
          - Sid: S3UploadsRead
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::portalai-dev-uploads"
              - !Sub "arn:${AWS::Partition}:s3:::portalai-dev-uploads/*"
          - Sid: SsmParamsRead
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:DescribeParameters
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/dev/*"
          - Sid: SecretsRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portalai/dev/*"
          # Bastion tunnel (db psql / studio). StartSession sits in READ:
          # it is the operator's daily DB-inspection path, the DB-write guard
          # is the CLI's prod barrier + --yes, and IAM cannot see the SQL
          # inside the forwarded connection. Env-isolated by the bastion's
          # Name tag so a dev session cannot tunnel to the prod bastion.
          - Sid: SsmStartSessionBastion
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Name: portalai-dev-bastion
          - Sid: SsmStartSessionDocuments
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSessionToRemoteHost"
          - Sid: SsmSessionLifecycle
            Effect: Allow
            Action:
              - ssm:TerminateSession
              - ssm:ResumeSession
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: "*"

  ProdOperatorReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: portalai-prod-operator-read
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogsRead
            Effect: Allow
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:GetLogRecord
              - logs:GetQueryResults
              - logs:StartQuery
              - logs:StopQuery
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/portalai-api-prod"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/portalai-api-prod:*"
          - Sid: ServiceDescribeReadOnly
            Effect: Allow
            Action:
              - ecs:Describe*
              - ecs:List*
              - rds:Describe*
              - cloudformation:Describe*
              - cloudformation:List*
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - elasticloadbalancing:Describe*
            Resource: "*"
          - Sid: S3UploadsRead
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::portalai-prod-uploads"
              - !Sub "arn:${AWS::Partition}:s3:::portalai-prod-uploads/*"
          - Sid: SsmParamsRead
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:DescribeParameters
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/prod/*"
          - Sid: SecretsRead
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portalai/prod/*"
          - Sid: SsmStartSessionBastion
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                aws:ResourceTag/Name: portalai-prod-bastion
          - Sid: SsmStartSessionDocuments
            Effect: Allow
            Action:
              - ssm:StartSession
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSession"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-StartPortForwardingSessionToRemoteHost"
          - Sid: SsmSessionLifecycle
            Effect: Allow
            Action:
              - ssm:TerminateSession
              - ssm:ResumeSession
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: "*"

  # ══════════════════════════════════════════════════════════
  #  Write policies — the mutation surface (per env)
  # ══════════════════════════════════════════════════════════
  # The small set of writes portalops performs: vars set (SSM param + secret),
  # and the one-off ECS tasks (db seed / upgrade / reset). Attached to the
  # WRITE role IN ADDITION to the read policy (write = read + these).
  DevOperatorWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: portalai-dev-operator-write
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SsmParamsWrite
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:AddTagsToResource
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/dev/*"
          - Sid: SecretsWrite
            Effect: Allow
            Action:
              - secretsmanager:PutSecretValue
              - secretsmanager:CreateSecret
              - secretsmanager:TagResource
              - secretsmanager:UpdateSecret
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portalai/dev/*"
          - Sid: EcsRunOneOffTasks
            Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/portalai-api-dev:*"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/portalai-dev/*"
          - Sid: PassTaskRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/portalai-dev-task-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/portalai-dev-task-execution-role"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  ProdOperatorWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: portalai-prod-operator-write
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SsmParamsWrite
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:AddTagsToResource
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/prod/*"
          - Sid: SecretsWrite
            Effect: Allow
            Action:
              - secretsmanager:PutSecretValue
              - secretsmanager:CreateSecret
              - secretsmanager:TagResource
              - secretsmanager:UpdateSecret
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:portalai/prod/*"
          - Sid: EcsRunOneOffTasks
            Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
            Resource:
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/portalai-api-prod:*"
              - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/portalai-prod/*"
          - Sid: PassTaskRoles
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/portalai-prod-task-role"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/portalai-prod-task-execution-role"
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  # ══════════════════════════════════════════════════════════
  #  Operator roles — assumed by portalai-operator
  # ══════════════════════════════════════════════════════════
  # Read is the default an operator holds; a mutation means explicitly
  # assuming the write role. Env-scoped trust (a dev session cannot assume
  # prod). Prod-write additionally requires MFA on AssumeRole — the IAM
  # mirror of the CLI's --confirm-prod barrier.
  DevOperatorReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portalai-dev-operator-read
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt OperatorUser.Arn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DevOperatorReadPolicy

  DevOperatorWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portalai-dev-operator-write
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt OperatorUser.Arn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DevOperatorReadPolicy
        - !Ref DevOperatorWritePolicy

  ProdOperatorReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portalai-prod-operator-read
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt OperatorUser.Arn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ProdOperatorReadPolicy

  ProdOperatorWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portalai-prod-operator-write
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt OperatorUser.Arn
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
      ManagedPolicyArns:
        - !Ref ProdOperatorReadPolicy
        - !Ref ProdOperatorWritePolicy

# ══════════════════════════════════════════════════════════
#  Exports — so a future SSO permission set or a CI reference
#  can resolve the operator identities.
# ══════════════════════════════════════════════════════════
Outputs:
  OperatorUserArn:
    Value: !GetAtt OperatorUser.Arn
    Export:
      Name: portalai-operator-user-arn
  DevOperatorReadRoleArn:
    Value: !GetAtt DevOperatorReadRole.Arn
    Export:
      Name: portalai-dev-operator-read-arn
  DevOperatorWriteRoleArn:
    Value: !GetAtt DevOperatorWriteRole.Arn
    Export:
      Name: portalai-dev-operator-write-arn
  ProdOperatorReadRoleArn:
    Value: !GetAtt ProdOperatorReadRole.Arn
    Export:
      Name: portalai-prod-operator-read-arn
  ProdOperatorWriteRoleArn:
    Value: !GetAtt ProdOperatorWriteRole.Arn
    Export:
      Name: portalai-prod-operator-write-arn
