AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Portals AI — demo custom webhook toolpack (#510). One shared Lambda
  function URL serving the custom-toolpack contract (GET /schema, GET /metadata,
  POST /runtime) for every demo environment.

# ── Two things to know before editing this file (#510) ────────────────
#
# 1. THIS STACK IS ENV-AGNOSTIC (like portalai-dns-email).
#    One shared endpoint serves the local, app-dev and prod demo orgs (epic
#    #507 decision), so the stack is named `portalai-demo-toolpack` with no
#    environment segment and takes no `Environment` parameter. A Lambda
#    function URL is public-internet reachable, so the prod demo org can call
#    it regardless of which env deployed it. Deployed once from the deploy-dev
#    workflow's deploy-infra job, exactly as portalai-dns-email is.
#
# 2. THE SIGNING SECRETS ARE SET BY HAND, NOT BY THE DEPLOY.
#    `SigningSecrets` is the PORTALAI_SIGNING_SECRETS allow-list (one whsec_
#    per demo env). While it's empty every route accepts unsigned calls
#    (mirroring the reference mock's SKIPPED mode; the demo payloads are
#    invented). Once it's set, every route is HMAC-verified, GET /schema and
#    /metadata included: since #911 each env's demo seed registers with a
#    secret chosen beforehand (DEMO_TOOLPACK_SIGNING_SECRETS), so the
#    registration fetch can be verified too. See
#    packages/demo-toolpack/README.md for the steps and release order.

# The handler code shipped by CloudFormation below is a PLACEHOLDER. The real
# code is pushed by `aws lambda update-function-code` in the deploy step, from
# the built @portalai/demo-toolpack package (zero runtime deps).

Parameters:
  SigningSecrets:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      Comma-separated PORTALAI_SIGNING_SECRETS allow-list (one whsec_ per demo
      env, each env's DEMO_TOOLPACK_SIGNING_SECRETS). Empty means unverified.

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: portalai-demo-toolpack
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          PORTALAI_SIGNING_SECRETS: !Ref SigningSecrets
      # CommonJS placeholder (inline ZipFile is CJS by default). Replaced by
      # the real ESM bundle via update-function-code in the deploy step.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              error: "PLACEHOLDER",
              detail: "Run aws lambda update-function-code with the built @portalai/demo-toolpack bundle.",
            }),
          });

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      # The HMAC signature on /runtime is the auth gate, not IAM.
      AuthType: NONE

  # A public function URL (AuthType NONE) on this account needs BOTH actions
  # granted to `*`: `lambda:InvokeFunctionUrl` AND `lambda:InvokeFunction`.
  # Granting only the former leaves the URL returning 403 AccessDeniedException
  # on every anonymous request even though the URL auth type is NONE — the
  # console states this explicitly ("missing permissions required for public
  # access"). `FunctionUrlAuthType: NONE` is only valid on the InvokeFunctionUrl
  # statement (Lambda rejects it on InvokeFunction), so the InvokeFunction grant
  # is unconditioned. That is acceptable for THIS function specifically: a
  # stateless demo toolpack returning deterministic invented data (shipping
  # quotes, credit scores) with no secrets and no side effects, so a public
  # Invoke grant exposes nothing worth protecting. Do NOT copy this pattern to a
  # function that touches real data — use AuthType AWS_IAM there instead.
  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"

Outputs:
  FunctionUrl:
    Description: The shared demo-toolpack endpoint base URL (append /schema, /runtime, /metadata).
    Value: !GetAtt Url.FunctionUrl
    Export:
      Name: demo-toolpack-url
