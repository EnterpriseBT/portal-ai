AWSTemplateFormatVersion: "2010-09-09"
Description: Portals AI — ElastiCache Redis

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  NodeType:
    Type: String
    Default: cache.t4g.micro
  # ── #383 ─────────────────────────────────────────────────
  # The Redis here is NOT a cache. It carries the BullMQ jobs queue. Losing the
  # node leaves rows non-terminal in Postgres, holding their
  # ENTITY_LOCKED_BY_JOB locks until the stranded sweep (#391) reaps them as
  # failed, which loses the work. A node replacement is therefore an
  # operational incident, not a cache miss; a planned one goes through
  # `portalops jobs redispatch` (#852) instead of the sweep.
  #
  # Prod runs a second node with automatic failover; dev runs one node.
  ReplicationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Prod runs "true" — two nodes with automatic failover and daily
      snapshots, instead of one node.
  SnapshotRetentionLimit:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 35
    Description: Daily snapshot retention in days; 0 disables snapshots.
Conditions:
  IsReplicated: !Equals [!Ref ReplicationEnabled, "true"]

Resources:
  # ── Cache Subnet Group ───────────────────────────────────
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub "portalai-${Environment} private subnets"
      SubnetIds:
        - !ImportValue
          Fn::Sub: "${Environment}-PrivateSubnet1"
        - !ImportValue
          Fn::Sub: "${Environment}-PrivateSubnet2"

  # ── Security Group ───────────────────────────────────────
  # Initially allows access from the entire VPC CIDR.
  # After backend.yml deploys, re-deploy this stack with an
  # additional ingress rule scoped to the ECS security group.
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "portalai-${Environment} ElastiCache Redis access"
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !ImportValue
            Fn::Sub: "${Environment}-VpcCidr"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-cache-sg"

  # ── Redis ────────────────────────────────────────────────
  # Encrypted at rest and in transit (#852), and the only cache: the plaintext
  # one it replaced was removed in #872, so every environment, new ones
  # included, gets this shape. One resource type for both environments: dev
  # is a one-node group, prod keeps two nodes with failover.
  # TransitEncryptionMode `required` makes the cluster refuse plaintext, so a
  # client without TLS fails to connect rather than talking in the clear.
  # The site's /security/ claims rest on these settings (security-controls.ts).
  EncryptedRedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "portalai-${Environment}-tls"
      ReplicationGroupDescription: !Sub "portalai-${Environment} redis, encrypted (jobs queue)"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref NodeType
      NumCacheClusters: !If [IsReplicated, 2, 1]
      AutomaticFailoverEnabled: !If [IsReplicated, true, false]
      MultiAZEnabled: !If [IsReplicated, true, false]
      SnapshotRetentionLimit: !Ref SnapshotRetentionLimit
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref CacheSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-redis-tls"

# ── Exports ──────────────────────────────────────────────
Outputs:
  RedisTlsEndpoint:
    Value: !GetAtt EncryptedRedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub "${Environment}-RedisTlsEndpoint"

  RedisTlsPort:
    Value: !GetAtt EncryptedRedisReplicationGroup.PrimaryEndPoint.Port
    Export:
      Name: !Sub "${Environment}-RedisTlsPort"

  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup
    Export:
      Name: !Sub "${Environment}-CacheSecurityGroupId"
