AWSTemplateFormatVersion: "2010-09-09"
Description: Portals AI — RDS PostgreSQL

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  InstanceClass:
    Type: String
    Default: db.t4g.micro
  AllocatedStorage:
    Type: Number
    Default: 20
  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  MasterUsername:
    Type: String
    Default: portalai
  # #383: both were fixed in the template — prod needs a longer window and
  # protection from an accidental stack delete. Defaults preserve dev exactly.
  BackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Automated backup retention in days. Prod runs >= 14.
  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Blocks DeleteDBInstance outright. Independent of the stack's
      DeletionPolicy/UpdateReplacePolicy Snapshot, which covers stack-level
      deletion but not a direct API call.

Resources:
  # ── DB Subnet Group ──────────────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "portalai-${Environment} private subnets"
      SubnetIds:
        - !ImportValue
          Fn::Sub: "${Environment}-PrivateSubnet1"
        - !ImportValue
          Fn::Sub: "${Environment}-PrivateSubnet2"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-db-subnet-group"

  # ── Security Group ───────────────────────────────────────
  # Initially allows access from the entire VPC CIDR.
  # After backend.yml deploys, re-deploy this stack with an
  # additional ingress rule scoped to the ECS security group.
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "portalai-${Environment} RDS PostgreSQL access"
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !ImportValue
            Fn::Sub: "${Environment}-VpcCidr"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-db-sg"

  # ── RDS Instance ─────────────────────────────────────────
  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "portalai-${Environment}"
      Engine: postgres
      EngineVersion: "17.9"
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref MultiAZ
      MasterUsername: !Ref MasterUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DeletionProtection: !Ref DeletionProtection
      AutoMinorVersionUpgrade: true
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-db"

# ── Exports ──────────────────────────────────────────────
Outputs:
  DbEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub "${Environment}-DbEndpoint"

  DbPort:
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub "${Environment}-DbPort"

  DbSecurityGroupId:
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Sub "${Environment}-DbSecurityGroupId"

  # #384: ManageMasterUserPassword (above) has RDS mint its own secret for the
  # master password, under a name AWS chooses (`rds!db-…`). Exporting the ARN
  # is what lets `portalops db url` compose the connection string without the
  # password ever being rendered to an operator.
  DbMasterSecretArn:
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub "${Environment}-DbMasterSecretArn"
