AWSTemplateFormatVersion: "2010-09-09"
Description: Portals AI — ECR + ECS Fargate + ALB

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  Subdomain:
    Type: String
    Default: api-dev
  DomainName:
    Type: String
    Default: portalsai.io
  CertificateArn:
    Type: String
    Description: >-
      ACM certificate ARN for the ALB HTTPS listener (the wildcard
      *.portalsai.io cert). A PARAMETER rather than an Fn::ImportValue (#383),
      matching frontend.yml and site.yml: the apex and wildcard share one DNS
      validation CNAME, so a second per-environment cert stack collides in
      Route 53. Deliberately defaultless — a default would let a missing value
      deploy the wrong certificate silently.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  FrontendOrigin:
    Type: String
    Default: https://app-dev.portalsai.io
    Description: Origin allowed to PUT to the upload bucket (browser CORS)
  # SIZING IS PER-ENVIRONMENT AND MUST BE PASSED EXPLICITLY (#424).
  # These defaults describe prod. They are NOT what every environment runs:
  # `aws cloudformation deploy` reuses whatever a stack was created with, so
  # a deploy that omits these inherits the stack's original values and a
  # raised default silently never lands — app-dev sat at 256/512 for four
  # months that way. Every workflow deploying this template states both, and
  # a guard test asserts it.
  Cpu:
    Type: Number
    Default: 1024
    Description: Fargate task vCPU units. 1024 = 1 vCPU. Prod default; app-dev deliberately runs 512 as a recorded cost choice. Sized to give the synchronous XLSX parse path enough headroom under the 250 MB upload cap.
  Memory:
    Type: Number
    Default: 8192
    AllowedValues: [512, 1024, 2048, 3072, 4096, 8192]
    Description: Fargate task memory (MB). Prod default 8192 = 8 GB; app-dev deliberately runs 4096. The CSV/XLSX adapters currently buffer the entire decoded workbook in memory before caching; a 40 MB CSV (5–20M cells) blew the previous 2 GB cap with exit code 137. Stop-gap until parse becomes streaming (see docs/LARGE_FILE_PARSE_STREAMING.plan.md). Valid Fargate combos for 1 vCPU run 2–8 GB. Constrained to the values NodeHeapByMemory maps, so the V8 heap can never outrun the container.
  DesiredCount:
    Type: Number
    Default: 1
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  BuildVersion:
    Type: String
    Default: dev
    Description: Build version string injected as BUILD_VERSION env var (e.g. dev-abc1234)
  BuildSha:
    Type: String
    Default: local
    Description: Git commit SHA injected as BUILD_SHA env var
  # ── Secrets Manager ARNs (full ARN including random suffix) ─
  # Partial ARNs fail with ResourceNotFoundException at task startup.
  # Retrieve with: aws secretsmanager describe-secret --secret-id portalai/{env}/<name> --query ARN
  SecretArnDatabaseUrl:
    Type: String
    Description: Full ARN of portalai/{env}/database-url secret
  SecretArnEncryptionKey:
    Type: String
    Description: Full ARN of portalai/{env}/encryption-key secret
  SecretArnAuth0WebhookSecret:
    Type: String
    Description: Full ARN of portalai/{env}/auth0-webhook-secret secret
  SecretArnAnthropicApiKey:
    Type: String
    Description: Full ARN of portalai/{env}/anthropic-api-key secret
  SecretArnTavilyApiKey:
    Type: String
    Description: Full ARN of portalai/{env}/tavily-api-key secret
  SecretArnGeocodingApiKey:
    Type: String
    Description: Full ARN of portalai/{env}/geocoding-api-key secret
  SecretArnGoogleOauthClientSecret:
    Type: String
    Description: Full ARN of portalai/{env}/google-oauth-client-secret secret
  SecretArnMicrosoftOauthClientSecret:
    Type: String
    Description: Full ARN of portalai/{env}/microsoft-oauth-client-secret secret
  SecretArnOauthStateSecret:
    Type: String
    Description: Full ARN of portalai/{env}/oauth-state-secret secret
  SecretArnStripeSecretKey:
    Type: String
    Description: Full ARN of portalai/{env}/stripe-secret-key secret
  SecretArnStripeWebhookSecret:
    Type: String
    Description: Full ARN of portalai/{env}/stripe-webhook-secret secret
  SecretArnGithubDispatchToken:
    Type: String
    Default: ""
    Description: >-
      Full ARN of portalai/{env}/github-dispatch-token secret (#311).
      Fine-grained PAT (Contents: read + repository dispatch) the API uses to
      request a marketing-site rebuild after a Stripe price change. Optional:
      empty leaves the container var unset, which makes the dispatch a no-op
      and lets the nightly scheduled rebuild carry the change instead.

# ── V8 heap ceiling, derived from the task's memory (#424) ──────────────
#
# CloudFormation has no arithmetic intrinsic, so the "~85% of Memory" rule
# is a table rather than a multiplication. That is the stronger form:
# !FindInMap FAILS THE DEPLOY on a Memory value with no entry, so a sizing
# whose heap nobody considered cannot ship. `Memory`'s AllowedValues is
# pinned to these keys so the two cannot disagree, and a guard test asserts
# every mapped heap is strictly below its container.
#
# The bug this replaces: a hardcoded --max-old-space-size=7000 inside a
# 512 MB task. V8 never felt pressure, never threw, and the kernel SIGKILLed
# the container instead (exit 137 → a bare 502, no stack trace).
Mappings:
  NodeHeapByMemory:
    "512":
      HeapMb: 435
    "1024":
      HeapMb: 870
    "2048":
      HeapMb: 1740
    "3072":
      HeapMb: 2611
    "4096":
      HeapMb: 3481
    "8192":
      HeapMb: 6963

Conditions:
  # #311: the site-rebuild PAT is optional. Without it the container var is
  # simply absent, `RebuildDispatchService` no-ops, and the nightly scheduled
  # rebuild remains the freshness guarantee.
  HasGithubDispatchToken: !Not [!Equals [!Ref SecretArnGithubDispatchToken, ""]]

Resources:
  # ── ECR Repository ───────────────────────────────────────
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "portalai-api-${Environment}"
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "portalai-api-${Environment}"

  # ── S3 Upload Access Logs Bucket ─────────────────────────
  # Self-logging bucket that receives server-access logs for UploadBucket.
  UploadAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portalai-${Environment}-uploads-access-logs"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        LogFilePrefix: self-logs/
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-uploads-access-logs"

  # ── S3 Upload Bucket ─────────────────────────────────────
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portalai-${Environment}-uploads"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref UploadAccessLogsBucket
        LogFilePrefix: s3-access/
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendOrigin
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-uploads"

  # ── ECS Cluster ──────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "portalai-${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}"

  # ── KMS Key for CloudWatch Log Encryption ────────────────
  LogGroupKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "KMS key for portalai-${Environment} CloudWatch log group"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/portalai-api-${Environment}"

  LogGroupKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/portalai-${Environment}-logs"
      TargetKeyId: !Ref LogGroupKmsKey

  # ── CloudWatch Log Group ─────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/portalai-api-${Environment}"
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogGroupKmsKey.Arn

  # ── IAM — Task Execution Role ────────────────────────────
  # Used by ECS agent to pull images, read secrets, write logs
  TaskExecutionManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "portalai-${Environment}-task-execution-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref SecretArnDatabaseUrl
              - !Ref SecretArnEncryptionKey
              - !Ref SecretArnAuth0WebhookSecret
              - !Ref SecretArnAnthropicApiKey
              - !Ref SecretArnTavilyApiKey
              - !Ref SecretArnGeocodingApiKey
              - !Ref SecretArnGoogleOauthClientSecret
              - !Ref SecretArnMicrosoftOauthClientSecret
              - !Ref SecretArnOauthStateSecret
              - !Ref SecretArnStripeSecretKey
              - !Ref SecretArnStripeWebhookSecret
              - !If
                - HasGithubDispatchToken
                - !Ref SecretArnGithubDispatchToken
                - !Ref AWS::NoValue
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*"
          - Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/*"

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portalai-${Environment}-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - !Ref TaskExecutionManagedPolicy

  # ── IAM — Task Role ──────────────────────────────────────
  # Used by the running container for S3 uploads, etc.
  TaskManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "portalai-${Environment}-task-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub "${UploadBucket.Arn}/*"
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt UploadBucket.Arn
          - Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
            Resource: "*"
          # #311: runtime business-config reads (BusinessConfigService) — the
          # app itself reads the `portalops vars` SSM catalog at request time,
          # TTL-cached, so a `vars set` reaches the public site-config
          # endpoint without a task recycle. Same grant shape as the
          # execution role's startup injection above.
          - Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/*"
          # #500: runtime resolution of the DB password from the RDS-managed
          # master secret (rds!…) — the execution role has the same grant for
          # startup injection; the RUNNING container needs it too, because it
          # re-fetches the password after each weekly managed rotation
          # (apps/api/src/db/credentials.util.ts, fed by DB_MASTER_SECRET_ARN).
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "portalai-${Environment}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TaskManagedPolicy

  # ── Security Groups ──────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "portalai-${Environment} ALB"
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-alb-sg"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "portalai-${Environment} ECS tasks"
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-ecs-sg"

  # ── ALB ──────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "portalai-${Environment}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: "${Environment}-PublicSubnet1"
        - !ImportValue
          Fn::Sub: "${Environment}-PublicSubnet2"
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        # Synchronous XLSX parse on the request handler can take 60–90 s for
        # workbooks near the 250 MB upload cap (ExcelJS does a full buffer
        # load + sync parse). The AWS default idle timeout of 60 s would
        # 504 those requests even though the task is still working. Bump
        # to 180 s; revisit if/when parse moves to a Bull worker.
        - Key: idle_timeout.timeout_seconds
          Value: "180"
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-alb"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "portalai-${Environment}-api-tg"
      VpcId: !ImportValue
        Fn::Sub: "${Environment}-VpcId"
      Protocol: HTTP
      Port: 3001
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "portalai-${Environment}-api-tg"

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ALBListenerHTTPRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # ── ECS Task Definition ──────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "portalai-api-${Environment}"
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/portalai-api-${Environment}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 3001
              Protocol: tcp
          HealthCheck:
            Command:
              [
                "CMD-SHELL",
                "curl -f http://localhost:3001/api/health || exit 1",
              ]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          Environment:
            - Name: PORT
              Value: "3001"
            - Name: NODE_ENV
              Value: production
            # Node defaults its old-space heap to roughly 1.5 GB regardless of
            # container memory, so the CSV/XLSX parsers can OOM the V8 heap
            # well before the cgroup limit fires — and a heap ABOVE the cgroup
            # is worse still, since the kernel kills the task before V8 ever
            # throws. Derived from Memory (see NodeHeapByMemory) so the ceiling
            # tracks whatever sizing the environment actually runs.
            - Name: NODE_OPTIONS
              Value: !Sub
                - "--max-old-space-size=${HeapMb}"
                - HeapMb:
                    !FindInMap [NodeHeapByMemory, !Ref Memory, HeapMb]
            - Name: LOG_LEVEL
              Value: info
            - Name: LOG_FORMAT
              Value: json
            - Name: BUILD_VERSION
              Value: !Ref BuildVersion
            - Name: BUILD_SHA
              Value: !Ref BuildSha
            - Name: UPLOAD_S3_BUCKET
              Value: !Ref UploadBucket
            - Name: UPLOAD_S3_REGION
              Value: !Ref AWS::Region
            - Name: UPLOAD_S3_PREFIX
              Value: uploads
            # The externally-reachable API origin, handed to webhook toolpack
            # runtimes as the pull-on-read callback (#124). Unset, the app
            # falls back to http://localhost:3001 and every third-party
            # runtime is told to call back to its own loopback (#382).
            - Name: PUBLIC_API_BASE_URL
              Value: !Sub "https://${Subdomain}.${DomainName}"
            # Derived from Subdomain, NOT Environment: the two coincide only
            # because dev's subdomain happens to be api-dev. An environment
            # whose subdomain isn't api-<env> — prod, at api.portalsai.io —
            # would otherwise advertise a callback host that doesn't exist.
            - Name: GOOGLE_OAUTH_REDIRECT_URI
              Value: !Sub "https://${Subdomain}.${DomainName}/api/connectors/google-sheets/callback"
            - Name: MICROSOFT_OAUTH_REDIRECT_URI
              Value: !Sub "https://${Subdomain}.${DomainName}/api/connectors/microsoft-excel/callback"
            - Name: REDIS_URL
              Value: !Sub
                - "redis://${Endpoint}:${Port}"
                - Endpoint: !ImportValue
                    Fn::Sub: "${Environment}-RedisEndpoint"
                  Port: !ImportValue
                    Fn::Sub: "${Environment}-RedisPort"
            # #500: ARN of the RDS-managed master secret (rds!…). The app
            # resolves the DB password from it per NEW connection (TTL-cached,
            # fail-open — apps/api/src/db/credentials.util.ts), so the weekly
            # managed rotation is absorbed by RUNNING tasks; the injected
            # DATABASE_URL below stays authoritative for host/user/dbname
            # only. An ARN is an identifier, not a secret — plain env is
            # deliberate.
            - Name: DB_MASTER_SECRET_ARN
              Value: !ImportValue
                Fn::Sub: "${Environment}-DbMasterSecretArn"
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref SecretArnDatabaseUrl
            - Name: ENCRYPTION_KEY
              ValueFrom: !Ref SecretArnEncryptionKey
            - Name: AUTH0_WEBHOOK_SECRET
              ValueFrom: !Ref SecretArnAuth0WebhookSecret
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Ref SecretArnAnthropicApiKey
            - Name: TAVILY_API_KEY
              ValueFrom: !Ref SecretArnTavilyApiKey
            - Name: GEOCODING_API_KEY
              ValueFrom: !Ref SecretArnGeocodingApiKey
            - Name: GOOGLE_OAUTH_CLIENT_SECRET
              ValueFrom: !Ref SecretArnGoogleOauthClientSecret
            - Name: MICROSOFT_OAUTH_CLIENT_SECRET
              ValueFrom: !Ref SecretArnMicrosoftOauthClientSecret
            - Name: OAUTH_STATE_SECRET
              ValueFrom: !Ref SecretArnOauthStateSecret
            - Name: STRIPE_SECRET_KEY
              ValueFrom: !Ref SecretArnStripeSecretKey
            - Name: STRIPE_WEBHOOK_SECRET
              ValueFrom: !Ref SecretArnStripeWebhookSecret
            - !If
              - HasGithubDispatchToken
              - Name: GITHUB_DISPATCH_TOKEN
                ValueFrom: !Ref SecretArnGithubDispatchToken
              - !Ref AWS::NoValue
            - Name: GOOGLE_OAUTH_CLIENT_ID
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/google-oauth-client-id"
            - Name: MICROSOFT_OAUTH_CLIENT_ID
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/microsoft-oauth-client-id"
            - Name: MICROSOFT_OAUTH_TENANT
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/microsoft-oauth-tenant"
            - Name: AUTH0_DOMAIN
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/auth0-domain"
            - Name: AUTH0_AUDIENCE
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/auth0-audience"
            - Name: CORS_ORIGIN
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/cors-origin"
            - Name: SYSTEM_ID
              ValueFrom: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portalai/${Environment}/system-id"

  # ── ECS Service ──────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerHTTPS
    Properties:
      ServiceName: !Sub "portalai-api-${Environment}"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "${Environment}-PrivateSubnet1"
            - !ImportValue
              Fn::Sub: "${Environment}-PrivateSubnet2"
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 3001
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Name
          Value: !Sub "portalai-api-${Environment}"

  # ── DNS Record ───────────────────────────────────────────
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${Subdomain}.${DomainName}"
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ALB.CanonicalHostedZoneID
        DNSName: !GetAtt ALB.DNSName

# ── Exports ──────────────────────────────────────────────
Outputs:
  EcrRepositoryUri:
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub "${Environment}-EcrRepositoryUri"

  EcsClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${Environment}-EcsClusterName"

  EcsServiceName:
    Value: !Sub "portalai-api-${Environment}"
    Export:
      Name: !Sub "${Environment}-EcsServiceName"

  EcsSecurityGroupId:
    Value: !Ref ECSSecurityGroup
