services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
      - "3001:3001"
      - "7006:7006"
      - "7007:7007"
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity
    networks:
      - mcp-net

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mcp-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  postgres:
    # PostGIS-enabled base image (#316). `CREATE EXTENSION postgis` in the
    # 0075 migration needs the extension shipped in the image; plain
    # postgres:17-alpine does not carry it. Pinned to the 17-3.5 line (PG17 +
    # PostGIS 3.5) to match RDS's Postgres 17.
    #
    # imresamu/postgis, not postgis/postgis: the official image is amd64-only
    # (no arm64 manifest), so it won't run on Apple-Silicon dev machines. The
    # imresamu mirror is a multi-arch (amd64+arm64) rebuild maintained by a
    # PostGIS contributor with identical tags/versions. CI runners are amd64
    # and would accept either. See docs/POSTGIS_FOUNDATION.spec.md.
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

  postgres-test:
    # PostGIS-enabled base image (#316) — must match the app database above so
    # the integration suite exercises the same substrate as production. See the
    # image note on the `postgres` service for why this is the imresamu mirror.
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal_ai_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcp-net

volumes:
  pgdata:
  ollama_data:
  redis-data:

networks:
  mcp-net:
    driver: bridge
