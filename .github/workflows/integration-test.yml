name: Integration Tests

on:
  push:
    branches-ignore:
      - main
  # Lets the durations refresh PR (#857) get its required checks: a push
  # made with GITHUB_TOKEN starts no workflows, but a dispatch does.
  workflow_dispatch:
  workflow_call:
    # Declared so a caller that forgets to pass them is visible HERE, in the
    # workflow that needs them (#454). `required: false` because a
    # push-triggered run has no caller at all — it is not licence for a
    # caller to omit them, and lint:ci-cache rule 2 enforces that.
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

# Turborepo remote cache (#454). A workflow-level block so every turbo call in
# this file inherits it, including ones added later.
#
# TURBO_TEAM is a repo VARIABLE, not a secret — it is an account slug, and
# repo variables reach reusable workflows without being declared below.
# TURBO_REMOTE_CACHE_SIGNATURE_KEY is required because turbo.json sets
# `remoteCache.signature`: artifacts are HMAC-verified on download and
# rejected on mismatch. Fail-OPEN on cache availability, fail-CLOSED on
# cache integrity.
#
# If the token is absent, turbo caches NOTHING and still reports success —
# there is no error to notice. `npm run lint:ci-cache` (rule 1) is what
# catches that, and a live workflow_dispatch is what proves it.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

# Leads with the literal "integration-test", not `github.workflow` — see unit-test.yml:
# inside a reusable workflow the context resolves to the caller, so siblings
# would share a group and cancel each other.
concurrency:
  group: "integration-test-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'branch' || github.run_id }}"
  cancel-in-progress: true

jobs:
  # The suite runs as N shards, each on its own runner with its own Postgres +
  # Redis, behind ONE required check (#857). The suites can't share a database
  # (teardownOrg deletes every row, queue suites obliterate shared queues), so
  # parallelism comes from runners, not Jest workers. The control logic is in
  # scripts/integration-shards.mjs, self-tested by lint:integration-shards.
  #
  #   changes ─▶ plan ─▶ shard × N ─▶ "Integration Tests" (the required check)

  # A docs-only push can't affect this suite, and the suite is the most
  # expensive thing in CI. This is deliberately NOT `paths-ignore` on the
  # trigger: "Integration Tests" is a REQUIRED status check on main, and a
  # required check that never runs never reports, so GitHub would block the
  # PR indefinitely (#427). The summary job below always reports; this job
  # only decides whether the shards run.
  #
  # "Docs-only" is measured from this branch's LAST SUCCESSFUL run of this
  # workflow, not the previous push (#663). Fails safe: any doubt runs the
  # suite. The logic and its self-test live in the script
  # (`npm run lint:integration-skip`).
  changes:
    name: "Integration Tests: changes"
    runs-on: ubuntu-latest
    # actions: read lets the skip decision read this workflow's run history.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the pushed range available locally to diff it below.
          fetch-depth: 0

      - name: Does anything outside docs/ change since the last green run?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration-skip-base.mjs

  # How many shards: enough for ~210s of recorded Jest time each, clamped to
  # 2..10. The cap is sized to the free plan's 20 concurrent jobs. No npm ci:
  # the planner needs only the durations file and the script.
  plan:
    name: "Integration Tests: plan"
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      capped: ${{ steps.plan.outputs.capped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            apps/api/src/__tests__/__integration__/durations.json
          sparse-checkout-cone-mode: false

      - name: Plan the shards
        id: plan
        run: node scripts/integration-shards.mjs plan

  shard:
    name: Integration Tests (shard ${{ matrix.index }}/${{ needs.plan.outputs.count }})
    needs: [changes, plan]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Every shard runs to the end even when one fails: the summary wants
      # every report, and a failure in one shard says nothing about the rest.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start test services
        run: docker compose up -d postgres-test redis --wait

      - name: Setup
        uses: ./.github/actions/setup

      # INTEGRATION_SHARD reaches Jest through apps/api's test:integration
      # (`--shard`, plus a JSON report) and is hashed by turbo, so each shard
      # is its own cache entry (lint:ci-cache rule 6). The report is a turbo
      # output, so a cache hit restores it too.
      - name: Run integration tests (shard ${{ matrix.index }}/${{ needs.plan.outputs.count }})
        env:
          INTEGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/portal_ai_test
          REDIS_URL: redis://localhost:6380
          INTEGRATION_SHARD: ${{ matrix.index }}/${{ needs.plan.outputs.count }}
        run: npm run test:integration

      - name: Upload the shard's Jest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-jest-${{ matrix.index }}
          path: apps/api/jest-integration-report.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Stop test services
        if: always()
        run: docker compose down

  # THE required check. GitHub matches required contexts by job name, so this
  # job — not the shards — carries "Integration Tests", and it runs whatever
  # happened upstream (`always()`): green only when the docs-only skip said
  # not to run, or when every shard passed and the suites across them add up
  # to the checkout's test files (a file in no shard, or two, shows as a
  # mismatch). Over-budget shards and the shard cap only warn.
  # lint:ci-cache rule 3 holds this shape.
  summary:
    name: Integration Tests
    needs: [changes, plan, shard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            apps/api/src
          sparse-checkout-cone-mode: false

      - name: Download the shards' Jest reports
        if: needs.changes.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: integration-jest-*
          path: reports

      - name: Every shard green, every file run exactly once?
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          PLANNED_COUNT: ${{ needs.plan.outputs.count }}
          CAPPED: ${{ needs.plan.outputs.capped }}
        run: node scripts/integration-shards.mjs summarize --reports reports
