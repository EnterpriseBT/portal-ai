name: Deploy Static Site

# Reusable deploy for the public marketing site (#311). Both callers
# (`deploy-site-dev.yml`, `deploy-site-prod.yml`) go through here so the dev
# and prod paths cannot drift — the only differences between them are the
# inputs below.

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | prod — selects stack names and CloudFormation Environment"
        required: true
        type: string
      subdomain:
        description: "Subdomain prefix, e.g. site-dev or www"
        required: true
        type: string
      build-ref:
        description: "Git ref to build. Prod always passes a release tag, never a branch."
        required: true
        type: string
      site-url:
        description: "Canonical origin, e.g. https://site-dev.portalsai.io"
        required: true
        type: string
      site-config-url:
        description: "The public site-config endpoint. ALWAYS set — an empty value would produce a fixture build."
        required: true
        type: string
      app-url:
        description: "Where sign-in/sign-up CTAs point"
        required: true
        type: string
      portalops-env:
        description: >-
          The `portalops --env` name for this environment (e.g. `app-dev`,
          `prod`). Used only in the preflight's remediation copy — it differs
          from `environment` (the CFN/stack name), so the two are separate
          inputs on purpose.
        required: true
        type: string
      cert-stack:
        description: >-
          CloudFormation stack that OWNS the wildcard certificate. Defaults to
          the environment's own `portalai-<env>-dns-certs`. Prod passes the
          dev-owned stack deliberately: the apex and the wildcard share one DNS
          validation CNAME, so a second stack for the same names in the same
          hosted zone collides in Route 53 (#383, #386). One certificate, one
          owner — a guard test asserts no workflow creates a prod cert stack.
        type: string
        required: false
      gh-environment:
        description: >-
          GitHub Environment to run under, for its protection rules. A caller
          job that uses `uses:` cannot declare `environment:` itself, so the
          prod gate (required reviewers) has to be applied here.
        required: false
        type: string
        default: ""
    secrets:
      aws-role-arn:
        required: true
      hosted-zone-id:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh-environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout ${{ inputs.build-ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build-ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy site stack
        run: |
          CERT_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.cert-stack || format('portalai-{0}-dns-certs', inputs.environment) }}" \
            --query "Stacks[0].Outputs[?ends_with(ExportName, '-CertificateArn')].OutputValue | [0]" \
            --output text)
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
            echo "::error::No -CertificateArn output on ${{ inputs.cert-stack || format('portalai-{0}-dns-certs', inputs.environment) }}"
            exit 1
          fi
          aws cloudformation deploy \
            --stack-name portalai-${{ inputs.environment }}-site \
            --template-file infra/cloudformation/site.yml \
            --parameter-overrides \
              Environment=${{ inputs.environment }} \
              Subdomain=${{ inputs.subdomain }} \
              CertificateArn="$CERT_ARN" \
              HostedZoneId=${{ secrets.hosted-zone-id }} \
            --no-fail-on-empty-changeset

      # Probe the endpoint before building. The build would fail on a bad
      # response anyway, but as a raw thrown fetch — this classifies it
      # (no public tiers / a price unresolvable / API still rolling) and prints
      # the exact `portalops` remediation for the environment. Bounded retry
      # tolerates an API mid-roll; a 503 (fail-closed config) is terminal.
      - name: Preflight site-config
        env:
          SITE_CONFIG_URL: ${{ inputs.site-config-url }}
          PORTALOPS_ENV: ${{ inputs.portalops-env }}
          IS_PROD: ${{ inputs.environment == 'prod' }}
        run: node apps/site/scripts/preflight-site-config.mjs

      # `SITE_CONFIG_URL` is set, so any failure to reach or parse the
      # endpoint fails this step. That is the intent: keep the last good
      # deploy live rather than publish a page with missing prices.
      # Contact addresses are env-derived (#369): SSM is the single write
      # path and the build bakes them in, so the site no longer asks the API
      # what its own support address is. A missing parameter is not fatal —
      # lib/contact.ts falls back to the QA inbox, an address we own, and
      # verify-pages still fails an empty mailto:.
      - name: Resolve contact addresses
        id: contact
        run: |
          prefix="/portalai/${{ inputs.environment == 'prod' && 'prod' || 'dev' }}"
          get() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || true
          }
          echo "support=$(get "$prefix/support-email")" >> "$GITHUB_OUTPUT"
          echo "sales=$(get "$prefix/sales-email")" >> "$GITHUB_OUTPUT"
          echo "admin=$(get "$prefix/admin-email")" >> "$GITHUB_OUTPUT"

      - name: Build site
        env:
          SITE_URL: ${{ inputs.site-url }}
          SITE_CONFIG_URL: ${{ inputs.site-config-url }}
          SITE_APP_URL: ${{ inputs.app-url }}
          GITHUB_SHA: ${{ github.sha }}
          SUPPORT_EMAIL: ${{ steps.contact.outputs.support }}
          SALES_EMAIL: ${{ steps.contact.outputs.sales }}
          ADMIN_EMAIL: ${{ steps.contact.outputs.admin }}
        run: npx turbo run build --filter=@portalai/site

      # Belt and braces over the build's own check: if the fixture ever
      # reached a published artifact, every price on the site would be $0.
      - name: Refuse to publish a fixture build
        run: |
          if grep -rl 'name="portal:build" content="[^"]*fixture' apps/site/dist --include='*.html'; then
            echo "::error::Built HTML carries the fixture stamp — the build did not read live config. Refusing to publish."
            exit 1
          fi
          echo "No fixture stamp found; build used live configuration."

      # Microsoft publisher verification reads
      # /.well-known/microsoft-identity-association.json. Publishing it with the
      # placeholder still in place fails verification in a way that looks like a
      # Microsoft problem rather than ours, so refuse — same posture as the
      # fixture-stamp check above.
      - name: Refuse to publish an unfilled identity association
        run: |
          F=apps/site/dist/.well-known/microsoft-identity-association.json
          if [ -f "$F" ] && grep -q 'REPLACE_WITH' "$F"; then
            echo "::error::$F still carries its placeholder applicationId. Fill in the Entra application (client) id before publishing."
            exit 1
          fi

      - name: Resolve stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name portalai-${{ inputs.environment }}-site \
            --query "Stacks[0].Outputs[?ExportName=='${{ inputs.environment }}-SiteBucketName'].OutputValue" \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name portalai-${{ inputs.environment }}-site \
            --query "Stacks[0].Outputs[?ExportName=='${{ inputs.environment }}-SiteDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      # Two passes, in this order, both deliberate:
      #
      #  1. Fingerprinted assets (/_astro/*) are immutable — cache them for a
      #     year. Uploading them FIRST means the new HTML never references an
      #     asset that isn't there yet.
      #  2. HTML/XML/TXT must revalidate every time, or a price change would
      #     sit in browser caches long after the invalidation.
      #
      # `--delete` runs only on the second pass, once every replacement
      # object is already in place.
      - name: Sync immutable assets
        run: |
          aws s3 sync apps/site/dist/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --exclude "*.json" \
            --cache-control "public, max-age=31536000, immutable"

      # The two passes MUST stay symmetric: every extension included here is
      # excluded above. `s3 sync` skips objects whose size and mtime already
      # match, so a file uploaded by the first pass would NOT be re-uploaded by
      # this one — it would keep the immutable header. An `--include` here
      # without the matching `--exclude` above is therefore a silent no-op.
      # A guard test asserts the symmetry.
      - name: Sync HTML and machine-readable files
        run: |
          aws s3 sync apps/site/dist/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" \
            --include "*.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*"

      - name: Summary
        run: |
          {
            echo "### Site deployed"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- URL: ${{ inputs.site-url }}"
            echo "- Built from: \`${{ inputs.build-ref }}\` (${{ github.sha }})"
            echo "- Config source: ${{ inputs.site-config-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
