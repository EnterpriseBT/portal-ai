name: Deploy Prod

# The production pipeline for app.portalsai.io + api.portalsai.io (#383).
#
# Mirrors deploy-dev.yml, with four deliberate differences — each is asserted
# by packages/devops-cli/src/__tests__/deploy-parity.test.ts, because an
# omission is invisible in review and "restoring parity" between these two
# files is the predictable mistake:
#
#   1. NO mail DNS stack. portalai-dns-email is domain-wide (one zone, one set
#      of MX records) and is owned by the dev pipeline. A copy here would
#      fight it over the same records.
#   2. NO contact seeding. #319 leaves prod fail-closed on purpose; seeding
#      would publish a qa@ placeholder on the public marketing site. Prod's
#      addresses are provisioned by hand (docs/PROD_PROVISIONING.runbook.md).
#   3. NO tag-deploy job. Under a release trigger the release tag is already
#      the deployment marker.
#   4. NO site stack. www.portalsai.io is deployed by deploy-site-prod.yml,
#      which keys off the same release event.

# Releases ONLY. No workflow_dispatch: a dispatch runs against a branch ref,
# so "what is in production" becomes "whatever main happened to be at that
# moment" — which defeats the point of tagging a release. Rollback does not
# need it either: re-running a previous release's workflow run replays that
# release's tag.
on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  # A queued release WAITS. Cancelling mid-run could abort a database
  # migration between statements.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # The wildcard *.portalsai.io certificate. It lives in the dev-named cert
  # stack because the apex and wildcard share one DNS validation CNAME, so a
  # second stack for the same names in the same zone collides. Moving it to a
  # domain-level stack (as portalai-dns-email already is) is tracked
  # separately; see docs/PROD_AWS_INFRA.discovery.md, Decision 2.
  CERT_STACK: portalai-dev-dns-certs
  CERT_EXPORT: dev-CertificateArn

jobs:
  # ── Tests ─────────────────────────────────────────────────
  # A release is cut from an already-merged main, but "the tag came from a
  # green commit" is an assumption, not a check. These are cheap relative to
  # a bad production deploy.
  unit-test:
    uses: ./.github/workflows/unit-test.yml

  integration-test:
    uses: ./.github/workflows/integration-test.yml

  # Prod gates on at least as much as a PR does (#427). Unconditional, for the
  # same reason the suites above are: a release tag can be cut from any commit,
  # so "this tree already passed" is an assumption here, not a fact.
  static-checks:
    uses: ./.github/workflows/static-checks.yml

  # ── Infrastructure ────────────────────────────────────────
  deploy-infra:
    needs: [unit-test, integration-test, static-checks]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the wildcard certificate
        id: cert
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name "$CERT_STACK" \
            --query "Stacks[0].Outputs[?ExportName=='${{ env.CERT_EXPORT }}'].OutputValue" \
            --output text)
          if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
            echo "::error::Could not resolve $CERT_EXPORT from $CERT_STACK"
            exit 1
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # NO VpcCidr override: prod uses the template default (10.0.0.0/16),
      # the same block as dev.
      #
      # #383's discovery recommended a distinct CIDR so the two could peer
      # later. That was wrong, and the first prod deploy proved it: the four
      # subnets are HARDCODED to 10.0.x.0/24, so a 10.1.0.0/16 VPC rejected
      # every one of them ("The CIDR '10.0.1.0/24' is invalid"). VpcCidr is a
      # parameter in name only.
      #
      # Deriving the subnets with Fn::Cidr would fix that, but CloudFormation
      # does not resolve Fn::Cidr when building a change set, so it reports
      # every subnet as replaced even where the resolved value is identical —
      # against app-dev that means rebuilding the subnets, the NAT gateway,
      # and everything inside them. Not worth it for a peering option we do
      # not need; separate VPCs may overlap freely.
      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-network \
            --template-file infra/cloudformation/network.yml \
            --parameter-overrides \
              Environment=prod \
            --no-fail-on-empty-changeset

      # Sizing: the cheapest class that works, and the minimum storage —
      # storage can grow but never shrink, so small is the reversible
      # direction.
      #
      # MultiAZ=false is a DELIBERATE deviation from #383, which specified
      # true. Multi-AZ roughly doubles the cost by running a standby, and at
      # launch volume that is not yet worth paying. It is reversible: enabling
      # it later is a modify with a brief failover, not a rebuild.
      #
      # What single-AZ costs until then: an AZ or instance failure means real
      # downtime and a restore from snapshot rather than an automatic
      # failover, and maintenance windows are disruptive. BackupRetentionPeriod
      # below and the pre-migration snapshot in deploy-backend are what make
      # that recoverable. Flip this to true before it matters.
      - name: Deploy database stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-database \
            --template-file infra/cloudformation/database.yml \
            --parameter-overrides \
              Environment=prod \
              InstanceClass=db.t4g.micro \
              AllocatedStorage=20 \
              MultiAZ=false \
              BackupRetentionPeriod=14 \
              DeletionProtection=true \
            --no-fail-on-empty-changeset

      - name: Deploy bastion stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-bastion \
            --template-file infra/cloudformation/bastion.yml \
            --parameter-overrides Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy cache stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-cache \
            --template-file infra/cloudformation/cache.yml \
            --parameter-overrides \
              Environment=prod \
              ReplicationEnabled=true \
              SnapshotRetentionLimit=7 \
            --no-fail-on-empty-changeset

      - name: Deploy frontend stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-frontend \
            --template-file infra/cloudformation/frontend.yml \
            --parameter-overrides \
              Environment=prod \
              Subdomain=app \
              CertificateArn="${{ steps.cert.outputs.arn }}" \
              HostedZoneId=${{ secrets.PROD_HOSTED_ZONE_ID }} \
            --no-fail-on-empty-changeset

      # FIRST-DEPLOY BOOTSTRAP.
      #
      # backend.yml creates the ECR repository AND the ECS service, so on a
      # brand-new environment the service would be created against an empty
      # registry, fail to pull, and roll the stack back — taking with it the
      # job that pushes the image.
      #
      # The rule that actually holds: THIS JOB NEVER SCALES THE SERVICE UP.
      # Only deploy-backend does, because only it has pushed an image and set
      # ImageTag to match. An earlier version probed ECR for "any image" as a
      # proxy for "the service can start" — wrong, because the service starts
      # whatever tag the TASK DEFINITION names, and this job never sets
      # ImageTag, so it stays `latest`, which prod never publishes. That probe
      # found a prod-<sha> image, set DesiredCount=2, and spent an hour failing
      # to pull `latest` before rolling back.
      #
      # So: 0 on first create, and on every later deploy omit the parameter
      # entirely so CloudFormation inherits the running value (no scale-down,
      # no outage). ImageTag is likewise never set here.
      - name: Decide the desired task count
        id: scale
        run: |
          if aws cloudformation describe-stacks \
               --stack-name portalai-prod-backend >/dev/null 2>&1; then
            echo "::notice::Backend stack exists — inheriting its DesiredCount; deploy-backend owns scaling."
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::First deploy — creating the ECS service with DesiredCount=0; deploy-backend will scale it up."
            echo "args=DesiredCount=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend stack
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-backend \
            --template-file infra/cloudformation/backend.yml \
            --parameter-overrides \
              Environment=prod \
              Subdomain=api \
              CertificateArn="${{ steps.cert.outputs.arn }}" \
              HostedZoneId=${{ secrets.PROD_HOSTED_ZONE_ID }} \
              FrontendOrigin=https://app.portalsai.io \
              ${{ steps.scale.outputs.args }} \
              SecretArnDatabaseUrl=${{ secrets.PROD_SECRET_ARN_DATABASE_URL }} \
              SecretArnEncryptionKey=${{ secrets.PROD_SECRET_ARN_ENCRYPTION_KEY }} \
              SecretArnAuth0WebhookSecret=${{ secrets.PROD_SECRET_ARN_AUTH0_WEBHOOK_SECRET }} \
              SecretArnAnthropicApiKey=${{ secrets.PROD_SECRET_ARN_ANTHROPIC_API_KEY }} \
              SecretArnTavilyApiKey=${{ secrets.PROD_SECRET_ARN_TAVILY_API_KEY }} \
              SecretArnGeocodingApiKey=${{ secrets.PROD_SECRET_ARN_GEOCODING_API_KEY }} \
              SecretArnGoogleOauthClientSecret=${{ secrets.PROD_SECRET_ARN_GOOGLE_OAUTH_CLIENT_SECRET }} \
              SecretArnMicrosoftOauthClientSecret=${{ secrets.PROD_SECRET_ARN_MICROSOFT_OAUTH_CLIENT_SECRET }} \
              SecretArnOauthStateSecret=${{ secrets.PROD_SECRET_ARN_OAUTH_STATE_SECRET }} \
              SecretArnStripeSecretKey=${{ secrets.PROD_SECRET_ARN_STRIPE_SECRET_KEY }} \
              SecretArnStripeWebhookSecret=${{ secrets.PROD_SECRET_ARN_STRIPE_WEBHOOK_SECRET }} \
              SecretArnGithubDispatchToken=${{ secrets.PROD_SECRET_ARN_GITHUB_DISPATCH_TOKEN }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  # ── Frontend ──────────────────────────────────────────────
  deploy-frontend:
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Baked into the bundle at BUILD time, resolved from SSM — not repo
      # secrets. Without this step the app advertises the qa@ fallback.
      - name: Resolve contact addresses
        id: contact
        run: |
          get() {
            aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || true
          }
          echo "support=$(get /portalai/prod/support-email)" >> "$GITHUB_OUTPUT"
          echo "sales=$(get /portalai/prod/sales-email)" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: npx turbo run build --filter=@portalai/web
        env:
          VITE_APP_VERSION: ${{ github.event.release.tag_name || github.sha }}
          VITE_APP_SHA: ${{ github.sha }}
          VITE_AUTH0_DOMAIN: ${{ secrets.PROD_VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.PROD_VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.PROD_VITE_AUTH0_AUDIENCE }}
          VITE_API_BASE_URL: https://api.portalsai.io
          VITE_SUPPORT_EMAIL: ${{ steps.contact.outputs.support }}
          VITE_SALES_EMAIL: ${{ steps.contact.outputs.sales }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.PROD_VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PROD_VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.PROD_VITE_GOOGLE_CLOUD_PROJECT_NUMBER }}

      - name: Get frontend outputs
        id: fe
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-frontend \
            --query "Stacks[0].Outputs[?ExportName=='prod-FrontendBucketName'].OutputValue" \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-frontend \
            --query "Stacks[0].Outputs[?ExportName=='prod-CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: aws s3 sync apps/web/dist "s3://${{ steps.fe.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.fe.outputs.dist }} --paths "/*"

  # ── Backend ───────────────────────────────────────────────
  deploy-backend:
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URI
        id: ecr
        run: |
          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-backend \
            --query "Stacks[0].Outputs[?ExportName=='prod-EcrRepositoryUri'].OutputValue" \
            --output text)
          echo "uri=$ECR_URI" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No `:latest` tag in production — a mutable tag makes "what is running"
      # unanswerable after the fact. The release tag and the sha are enough.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.uri }}:prod-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.event.release.tag_name || github.sha }}
            BUILD_SHA=${{ github.sha }}
          provenance: false

      - name: Get ECS configuration
        id: ecs
        run: |
          CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-backend \
            --query "Stacks[0].Outputs[?ExportName=='prod-EcsClusterName'].OutputValue" \
            --output text)
          SERVICE=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-backend \
            --query "Stacks[0].Outputs[?ExportName=='prod-EcsServiceName'].OutputValue" \
            --output text)
          ECS_SG=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-backend \
            --query "Stacks[0].Outputs[?ExportName=='prod-EcsSecurityGroupId'].OutputValue" \
            --output text)
          SUBNET1=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-network \
            --query "Stacks[0].Outputs[?ExportName=='prod-PrivateSubnet1'].OutputValue" \
            --output text)
          SUBNET2=$(aws cloudformation describe-stacks \
            --stack-name portalai-prod-network \
            --query "Stacks[0].Outputs[?ExportName=='prod-PrivateSubnet2'].OutputValue" \
            --output text)
          TASK_DEF=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query "services[0].taskDefinition" --output text)
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "task_def=$TASK_DEF" >> "$GITHUB_OUTPUT"
          echo "network_config=awsvpcConfiguration={subnets=[$SUBNET1,$SUBNET2],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" >> "$GITHUB_OUTPUT"

      # The one-off migrate/seed tasks must run the image just built — they
      # execute migration files baked into it. But they must NOT roll the
      # service onto new code before the schema is migrated, so updating the
      # stack here is not an option.
      #
      # Dev sidesteps this by re-pointing `:latest`, which its task definition
      # references; prod pins the immutable prod-<sha> instead, so that
      # mechanism does not exist here. Without this step the migrate task runs
      # whatever the SERVICE points at: on a first deploy a tag with no image
      # (the failure that produced "Migration failed with exit code None"), and
      # on later deploys the PREVIOUS image — applying last release's
      # migrations, one release behind, silently.
      #
      # So: register a revision pointing at the new image, use it for the
      # one-off tasks only, and leave the service alone until after the seed.
      - name: Register a migration task definition
        id: migtd
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ steps.ecs.outputs.task_def }} \
            --query 'taskDefinition' --output json > /tmp/td.json
          python3 - <<'PY'
          import json
          td = json.load(open('/tmp/td.json'))
          for k in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                    "compatibilities", "registeredAt", "registeredBy", "deregisteredAt"):
              td.pop(k, None)
          td["containerDefinitions"][0]["image"] = (
              "${{ steps.ecr.outputs.uri }}:prod-${{ github.sha }}"
          )
          json.dump(td, open('/tmp/td-new.json', 'w'))
          PY
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Migration task definition: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # The deployment circuit breaker reverts the IMAGE on a bad rollout. It
      # does not revert the SCHEMA — a migrated database with a rolled-back
      # image is the dangerous state, and this snapshot is the way back.
      # Migrations must also stay backward-compatible with the previous image.
      - name: Snapshot the database before migrating
        run: |
          SNAP="portalai-prod-premigrate-${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier portalai-prod \
            --db-snapshot-identifier "$SNAP"
          echo "Waiting for snapshot $SNAP..."
          aws rds wait db-snapshot-completed --db-snapshot-identifier "$SNAP"

      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.ecs.outputs.cluster }} \
            --task-definition ${{ steps.migtd.outputs.arn }} \
            --launch-type FARGATE \
            --network-configuration "${{ steps.ecs.outputs.network_config }}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["npm","run","db:migrate:ci"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.ecs.outputs.cluster }} --tasks "$TASK_ARN"
          # Read the WHOLE task, not just the exit code. A container that never
          # started reports a null exit code ("None") and the actual cause lives
          # in stoppedReason — and the task record ages out within the hour, so
          # printing it here is the only chance to capture it.
          aws ecs describe-tasks \
            --cluster ${{ steps.ecs.outputs.cluster }} --tasks "$TASK_ARN" \
            --query 'tasks[0].{exit:containers[0].exitCode,reason:containers[0].reason,stopped:stoppedReason,code:stopCode}' \
            --output json > /tmp/task.json
          cat /tmp/task.json
          EXIT_CODE=$(python3 -c "import json;print(json.load(open('/tmp/task.json')).get('exit'))")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task did not succeed (exit=$EXIT_CODE). See stoppedReason above."
            exit 1
          fi

      - name: Run database seed
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.ecs.outputs.cluster }} \
            --task-definition ${{ steps.migtd.outputs.arn }} \
            --launch-type FARGATE \
            --network-configuration "${{ steps.ecs.outputs.network_config }}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["npm","run","db:seed:ci"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.ecs.outputs.cluster }} --tasks "$TASK_ARN"
          # Read the WHOLE task, not just the exit code. A container that never
          # started reports a null exit code ("None") and the actual cause lives
          # in stoppedReason — and the task record ages out within the hour, so
          # printing it here is the only chance to capture it.
          aws ecs describe-tasks \
            --cluster ${{ steps.ecs.outputs.cluster }} --tasks "$TASK_ARN" \
            --query 'tasks[0].{exit:containers[0].exitCode,reason:containers[0].reason,stopped:stoppedReason,code:stopCode}' \
            --output json > /tmp/task.json
          cat /tmp/task.json
          EXIT_CODE=$(python3 -c "import json;print(json.load(open('/tmp/task.json')).get('exit'))")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Seed task did not succeed (exit=$EXIT_CODE). See stoppedReason above."
            exit 1
          fi

      # NOTE: deploy-dev.yml seeds create-if-absent contact parameters here.
      # Prod does NOT — #319 leaves it fail-closed by design so a placeholder
      # can never be published on the public site. Prod's addresses are
      # provisioned by hand; see docs/PROD_PROVISIONING.runbook.md.

      # Restores DesiredCount after a first-deploy bootstrap, and rolls the
      # service onto the image pushed above.
      - name: Update backend stack and deploy
        run: |
          aws cloudformation deploy \
            --stack-name portalai-prod-backend \
            --template-file infra/cloudformation/backend.yml \
            --parameter-overrides \
              Environment=prod \
              ImageTag=prod-${{ github.sha }} \
              BuildVersion=${{ github.event.release.tag_name || github.sha }} \
              BuildSha=${{ github.sha }} \
              DesiredCount=2 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
