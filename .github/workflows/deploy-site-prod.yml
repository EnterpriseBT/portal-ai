name: Deploy Site (prod)

# The production marketing site (#311).
#
# Two things make this different from the dev caller:
#
#   1. It NEVER builds from a branch. Prod publishes a released tag, so a
#      merge to main can't reach the public site by accident. A dispatch or
#      manual run resolves the latest release tag instead.
#   2. It runs in the `prod` GitHub Environment, whose required reviewers
#      are the human gate on a public deploy.
#
# The prod API does not exist yet (#83). Until the `PROD_SITE_CONFIG_URL`
# repository variable is set, the job exits cleanly with a notice rather
# than building against a nonexistent origin — a fixture build must never
# reach production.
#
# `PROD_AWS_ROLE_ARN` / `PROD_HOSTED_ZONE_ID` must be REPOSITORY secrets,
# not environment secrets: they are read here, in the caller, while the
# `prod` environment is applied inside the reusable workflow.

on:
  release:
    types: [published]
  repository_dispatch:
    types: [site-config-changed]
  workflow_dispatch:

concurrency:
  group: deploy-site-prod
  cancel-in-progress: false

jobs:
  # ── Gate: is prod wired up, and what do we build? ─────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the ref to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.tag_name }}"
          else
            # Dispatch or manual: publish whatever is currently released.
            # Explicitly NOT `main` — unreleased work must not go public.
            REF=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          fi

          if [ -z "$REF" ]; then
            echo "::notice::No release exists yet — nothing to publish to production."
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "Building from release tag: $REF"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the prod API is configured
        id: ready
        run: |
          if [ -z "${{ vars.PROD_SITE_CONFIG_URL }}" ]; then
            echo "::notice::PROD_SITE_CONFIG_URL is unset (the prod API lands with #83). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ steps.ref.outputs.ref }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    uses: ./.github/workflows/deploy-static-site.yml
    with:
      environment: prod
      # Applied inside the reusable workflow — a job that `uses:` another
      # workflow cannot declare `environment:` itself. Required reviewers on
      # the `prod` environment are the human gate on a public deploy.
      gh-environment: prod
      subdomain: www
      # The bare domain people type, link, and print. Redirected to `www`,
      # which is already the canonical host baked into every built page
      # (`SITE_URL` → canonical/og:url/sitemap), so this must not be flipped
      # without rebuilding the site (#404).
      apex-domain: portalsai.io
      # The wildcard cert lives in the dev-named stack and is shared; prod
      # deliberately has none of its own (#383, #386).
      cert-stack: portalai-dev-dns-certs
      build-ref: ${{ needs.resolve.outputs.ref }}
      site-url: https://www.portalsai.io
      site-config-url: ${{ vars.PROD_SITE_CONFIG_URL }}
      app-url: https://app.portalsai.io
      portalops-env: prod
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      aws-role-arn: ${{ secrets.PROD_AWS_ROLE_ARN }}
      hosted-zone-id: ${{ secrets.PROD_HOSTED_ZONE_ID }}
