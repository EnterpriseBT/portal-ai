name: Unit Tests

on:
  push:
    branches-ignore:
      - main
  workflow_call:
    # Declared so a caller that forgets to pass them is visible HERE, in the
    # workflow that needs them (#454). `required: false` because a
    # push-triggered run has no caller at all — it is not licence for a
    # caller to omit them, and lint:ci-cache rule 2 enforces that.
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

# Turborepo remote cache (#454). A workflow-level block so every turbo call in
# this file inherits it, including ones added later.
#
# TURBO_TEAM is a repo VARIABLE, not a secret — it is an account slug, and
# repo variables reach reusable workflows without being declared below.
# TURBO_REMOTE_CACHE_SIGNATURE_KEY is required because turbo.json sets
# `remoteCache.signature`: artifacts are HMAC-verified on download and
# rejected on mismatch. Fail-OPEN on cache availability, fail-CLOSED on
# cache integrity.
#
# If the token is absent, turbo caches NOTHING and still reports success —
# there is no error to notice. `npm run lint:ci-cache` (rule 1) is what
# catches that, and a live workflow_dispatch is what proves it.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

# A new push to the same branch makes the in-flight run obsolete — cancel it
# rather than paying for a full cycle on a superseded commit (#427).
#
# The group leads with the LITERAL "unit-test", never `github.workflow`. Inside a
# reusable workflow every `github.*` context resolves to the CALLER, so all
# three suites invoked from one deploy run would share
# "Deploy Dev-<ref>-<run_id>" and — with `cancel-in-progress: true` — cancel
# each other. That is exactly what happened on the first manual dispatch: two
# of three suites cancelled, one survived.
#
# `github.run_id` is still the fallback for anything that is not a non-main
# branch push. It is unique per RUN, which stops runs cancelling each other;
# the literal is what stops SIBLINGS within a run from colliding. Both parts
# are needed.
concurrency:
  group: "unit-test-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'branch' || github.run_id }}"
  cancel-in-progress: true

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: npm run format:check

      - name: Check docs/*.md pointers in source resolve
        run: npm run lint:doc-pointers

      # Guards the CI remote-cache wiring and two invariants that nothing else
      # tests (#454): the required-check job names, and the concurrency-group
      # literal prefix. Both fail SILENTLY when broken — a renamed job un-gates
      # its required check, and a missing TURBO_TOKEN just stops caching while
      # still reporting success. The script self-tests its rules against
      # embedded fixtures before checking the real tree.
      - name: Check CI cache wiring and required-check invariants
        run: npm run lint:ci-cache

      - name: Run unit tests
        run: npm run test:unit
