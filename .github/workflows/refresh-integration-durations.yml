name: Refresh integration durations

# Watches apps/api's integration durations.json for drift (#857). The file
# sets how many shards the Integration Tests check runs and how files are
# split across them, so a stale one means too few shards and slow runs.
#
# Weekly, it takes the shard reports of the newest green Integration Tests
# run on a MERGED pull request's head (the tree that became main; a squash
# merge never puts the branch's own commits on main), recomputes the
# durations, and, when planning would act on the change, opens or updates one
# issue with the result and the command that applies it. A person runs that
# command and lands it in a normal PR.
#
# Why an issue, not a PR: a workflow opening a PR with GITHUB_TOKEN needs the
# repo setting "Allow GitHub Actions to create and approve pull requests",
# which would also let any workflow approve PRs. An issue needs only
# `issues: write`, and this job pushes nothing.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "refresh-integration-durations"
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  TITLE: "Integration test durations have drifted"

jobs:
  refresh:
    name: Refresh integration durations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # Newest first: a run whose commit is a recently merged PR's head, and
      # that actually ran shards (a docs-only skip reports green with none).
      - name: Download the newest merged run's shard reports
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh pr list --state merged --limit 50 --json headRefOid -q '.[].headRefOid' > merged.txt
          gh run list --workflow integration-test.yml --status success --limit 100 \
            --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"' > runs.txt
          while read -r id sha; do
            grep -qx "$sha" merged.txt || continue
            rm -rf reports
            if gh run download "$id" -p 'integration-jest-*' -D reports 2>/dev/null; then
              echo "run=$id" >> "$GITHUB_OUTPUT"
              echo "Using run $id ($sha)"
              exit 0
            fi
          done < runs.txt
          echo "::warning::No green Integration Tests run on a recently merged PR has shard reports; nothing to refresh."
          echo "run=" >> "$GITHUB_OUTPUT"

      # pipefail: without it `tee` would mask a failing update-durations and
      # the job would report green while the durations went stale.
      - name: Recompute the durations
        id: update
        if: steps.reports.outputs.run != ''
        run: |
          set -o pipefail
          node scripts/integration-shards.mjs update-durations --reports reports --if-changed | tee update.log

      - name: Open or update the drift issue
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.reports.outputs.run }}
        run: |
          set -o pipefail
          {
            echo "The recorded integration durations no longer match CI. They set the shard count and the split, so refreshing them keeps the \`Integration Tests\` check at 3–6 min (#857)."
            echo
            echo "From Integration Tests run [$RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID):"
            echo
            echo '```'
            cat update.log
            echo '```'
            echo
            echo "A line starting with \`!\` is a file over the 120s ceiling. \`lint:integration-durations\` will fail on it, so split it by concern first (or allowlist it with a reason in \`scripts/integration-shards.lib.mjs\`)."
            echo
            echo "**To apply**, on a branch off \`main\`:"
            echo
            echo '```bash'
            echo "gh run download $RUN_ID -p 'integration-jest-*' -D /tmp/integration-reports"
            echo "node scripts/integration-shards.mjs update-durations --reports /tmp/integration-reports"
            echo "git commit -am 'chore(ci): refresh integration durations'"
            echo '```'
            echo
            echo "Then open a PR. This issue is updated each week until the drift is gone."
          } > body.md

          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Updated #$existing"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
