name: nginx advisories

# Checks the residency web image's pinned nginx against nginx.org's security
# advisories (#918). nginx comes from nginx.org's apk repository, which the
# deploy-time Trivy gate (#909) can't see, so this is how an nginx CVE gets
# noticed. scripts/nginx-advisories.mjs reads the exact version from
# apps/web/Dockerfile's runtime FROM and reports any advisory covering it, or
# a newer stable release.
#
# Weekly, it opens or updates one issue when the pin is affected or stale,
# and closes that issue once a run comes back clean. The check fails closed:
# when it can't read the pin or parse nginx.org's pages, the issue says so and
# the run goes red, so a broken parser never reads as "no advisories". Like
# refresh-integration-durations.yml it needs only `issues: write` and pushes
# nothing; the fix is a normal PR bumping the tag and digest.

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: "nginx-advisories"
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TITLE: "nginx in the residency web image needs attention"

jobs:
  check:
    name: Check nginx advisories
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Exit 0 clean, 1 affected or stale, 2 couldn't check. The step
      # records the code instead of failing, so the issue step still runs.
      - name: Check the pinned nginx
        id: check
        run: |
          set +e
          node scripts/nginx-advisories.mjs --report report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Editing an issue's body notifies nobody, so every change a reader must
      # hear about is a comment: a new set of affecting advisories (compared by
      # the report's fingerprint line), a run that couldn't check, or the close.
      # A run that couldn't check comments and leaves the body alone, so the
      # last known advisory table stays on the issue.
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [ "$CODE" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --reason completed \
                --comment "The pinned nginx is now the current stable release with no open advisory ([run]($RUN_URL))."
              echo "Closed #$existing"
            fi
            exit 0
          fi
          if [ "$CODE" = "1" ]; then
            {
              cat report.md
              echo
              echo "From [this run]($RUN_URL). Patch SLA and policy: \`docs/SUPPLY_CHAIN.md\`. This issue is updated each week, and closed by the first clean run."
            } > body.md
          else
            cp report.md body.md
          fi
          if [ -z "$existing" ]; then
            gh issue create --title "$TITLE" --body-file body.md
            exit 0
          fi
          if [ "$CODE" = "1" ]; then
            before=$(gh issue view "$existing" --json body -q .body | grep -o '<!-- nginx-advisories:.*-->' || true)
            after=$(grep -o '<!-- nginx-advisories:.*-->' report.md)
            gh issue edit "$existing" --body-file body.md
            if [ "$before" != "$after" ]; then
              gh issue comment "$existing" --body "The findings changed; the issue body now lists them ([run]($RUN_URL))."
            fi
            echo "Updated #$existing"
          else
            gh issue comment "$existing" --body-file body.md
            echo "Commented on #$existing"
          fi

      - name: Fail when the check couldn't run
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '1'
        run: |
          echo "::error::The nginx advisory check couldn't run; see the issue \"$TITLE\"."
          exit 1
