name: "Playwright browsers"
description: "Installs the Chromium build @portalai/e2e's pinned @playwright/test launches, cached by that version (#489)"

runs:
  using: "composite"
  steps:
    # Keyed on the pinned @playwright/test version and the runner image
    # (#904): a bump or an OS move re-installs.
    - name: Playwright version
      id: pw
      shell: bash
      run: |
        echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.os }}-${{ steps.pw.outputs.version }}

    # No --with-deps (#965): the pinned runner image already carries every
    # library Chromium needs, and --with-deps ran apt-get on every run (cache
    # hit or not) only to add fonts nothing asserts on. A slow Ubuntu mirror
    # once stretched this step to 8 minutes against verify-login's 15. If an
    # image move drops a library, the launch fails with Playwright's "Host
    # system is missing dependencies" list, which is the reviewable signal.
    # `timeout` bounds a stalled browser download on a cache miss; composite
    # steps don't take timeout-minutes.
    - name: Install Chromium
      shell: bash
      run: timeout 300 npm run --workspace @portalai/e2e playwright:install
