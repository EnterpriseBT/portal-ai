name: "Setup Node & Install"
description: "Sets up Node.js and installs dependencies, restoring node_modules from cache when the dependency inputs are unchanged"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # node_modules itself, not npm's download cache (#857). `npm ci` took
    # ~65s per job even with ~/.npm cached, and the sharded integration suite
    # pays it once per shard. A restore is ~20–30s.
    #
    # The key is EXACT and there are no restore-keys: a hit is only ever a
    # tree installed from this lockfile and these package.json files, on this
    # OS, architecture and Node major (native addons are ABI-bound). Any
    # dependency change misses and runs `npm ci` exactly as before, which is
    # also what still catches a package.json out of sync with the lockfile.
    # Workspace links are relative symlinks, so the tree is valid at any
    # checkout path.
    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

    - name: Install dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
