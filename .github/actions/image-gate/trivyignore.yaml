# Time-boxed exceptions to the image gate (#1096). Every entry names the CVE,
# why it can't be exploited in what we ship, and when the exception lapses.
# Trivy reports an expired entry again, so a forgotten follow-up fails the
# next deploy instead of quietly staying ignored. Keep this file empty
# (`vulnerabilities: []`) whenever nothing is excepted.
#
# The policy for adding one is docs/SUPPLY_CHAIN.md → "Exceptions": the id
# scoped to one package's purl (the gate is shared by both images), a
# concrete reason the vulnerable code isn't reachable, the tracking issue,
# and an expiry no later than the severity's patch SLA.
vulnerabilities: []
